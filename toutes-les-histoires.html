<script>
var stories = [
  { cat: 'ASSOCIATION', title: "Ils replantent une forêt entière avec les habitants du village", meta: '6 min · Hier' },
  { cat: 'INNOVATION', title: "Une éolienne de poche qui recharge tout un village isolé", meta: '4 min · Mardi' },
  { cat: 'SOLIDARITÉ', title: "Des voisins transforment un parking en potager partagé", meta: '5 min · Lundi' },
  { cat: 'ARTICLE', title: "Ce quartier a divisé sa consommation d'énergie par deux", meta: '3 min · Dimanche' },
  { cat: 'JOURNAL', title: "Le mentorat gratuit qui redonne confiance à 400 lycéens", meta: '7 min · Samedi' },
  { cat: 'ASSOCIATION', title: "Une ressourcerie sauve 12 tonnes d'objets chaque mois", meta: '4 min · Vendredi' },
  { cat: 'INNOVATION', title: "Ils recyclent les filets de pêche en skateboards", meta: '5 min · Jeudi' },
  { cat: 'SOLIDARITÉ', title: "Un café suspendu réchauffe les soirées d'hiver du village", meta: '3 min · Mercredi' },
  { cat: 'ARTICLE', title: "La bibliothèque de rue qui rassemble tout le quartier", meta: '6 min · La semaine dernière' }
];
var wrap = document.getElementById('cards');
stories.forEach(function (s) {
  var a = document.createElement('a');
  a.className = 'dib-card';
  a.href = '#';
  a.innerHTML =
    '<div class="dib-card__media no-photo">PHOTO<span class="dib-card__badge">' + s.cat + '</span></div>' +
    '<div class="dib-card__title">' + s.title + '</div>' +
    '<div class="dib-card__meta">' + s.meta + '</div>';
  wrap.appendChild(a);
});
</script>
